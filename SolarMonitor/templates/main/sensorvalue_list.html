{% extends "../base.html" %}
{% block title %}Sensors{% endblock %}
{% block content %}
<ul  class="list-group  list-group-numbered">
{% for sensorval in sensorvalues %}
    <div class="card">
        <div class="card-body">
        <ul  class="list-group  list-group-flush">
            <li class="list-group-item card-title"> <h3>{{sensorval.sensor.name}}</h3></li>
            <li class="list-group-item"> {{sensorval.value}}</li>
            <li class="list-group-item"> {{sensorval.timestamp}}</li>
        </ul>
      </div>
    </div>
{% endfor %}
</ul >
{% endblock content %}
